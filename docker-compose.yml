version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - app-network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        echo "Waiting for Ollama service to start..."
        until ollama list >/dev/null 2>&1; do
          sleep 1
        done
        echo "Ollama is active. Downloading Llama 3.2 model..."
        ollama pull llama3.2
        echo "Downloading BGE-M3 embedding model..."
        ollama pull bge-m3
        echo "All models indexed successfully!"
        wait

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - STORAGE_PATH=/app/storage
      - JWT_SECRET_KEY=docker-local-super-secret-key-change-in-production
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - CORS_ORIGINS=["http://localhost:3000"]
    volumes:
      - ./storage:/app/storage
    depends_on:
      - ollama
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  ollama-data:
